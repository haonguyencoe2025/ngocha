<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Coach</title>
<style>
:root{--ink:#10243E;--sub:#5A6B80;--bg:#EEF3F8;--card:#fff;--line:#D9E2EC;--blue:#1F5FD6;--blue2:#E4EDFF;--sun:#FFB400;--ok:#1E9E5A;--okbg:#E3F6EB;--bad:#D6452F;--badbg:#FCE9E5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:16px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;letter-spacing:.2px}
header small{color:#9FB3CC;display:block;font-size:12px;font-weight:400}
.stats{display:flex;gap:8px}
.pill{background:#1c3556;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.pill b{color:var(--sun)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 2px 9px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
h2{font-size:20px;margin:4px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.fc{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .en{font-size:34px;font-weight:700}
.fc .ipa{color:var(--sub);margin-top:2px}
.fc .vi{font-size:24px;color:var(--blue);font-weight:700}
.fc .ex{margin-top:10px;color:var(--sub);font-style:italic}
.hint{color:var(--sub);font-size:13px;text-align:center;margin:6px 0 12px}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:var(--blue2);color:var(--blue)}
.btn.ok{background:var(--okbg);color:var(--ok)}
.btn.no{background:var(--badbg);color:var(--bad)}
.spk{border:0;background:var(--blue2);color:var(--blue);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.q{font-size:19px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;font:inherit;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin:6px 0 12px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 16px}
summary{padding:14px 0;font-weight:700;cursor:pointer}
details .in{padding-bottom:14px}
.rule{background:var(--blue2);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
.eg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.eg div{flex:1}.eg em{color:var(--sub);font-style:normal;font-size:14px;display:block}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:10px 0}
.big{text-align:center;padding:26px 10px}
.big .n{font-size:54px;font-weight:800;color:var(--blue)}
.mq{background:var(--sun);color:var(--ink);overflow:hidden;white-space:nowrap;font-weight:700;font-size:14px;padding:6px 0}
.mq span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.mq span{animation-duration:30s}}
.tip{background:#FFF5D6;border-left:4px solid var(--sun);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:15px}
.spk{width:auto;height:auto;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700}
nav button{font-size:12px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g .opt{margin:0;text-align:center}
.sc{font-size:30px;letter-spacing:6px;text-align:center;font-weight:800;color:var(--blue);margin:10px 0}
.lt{width:38px;padding:8px 0;margin:3px;text-align:center}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:10px 0}
.pv{max-width:100%;border-radius:12px;margin-top:10px}
.tm{font-size:13px;color:var(--sub);margin-top:4px}
.card{border:2px solid #8FB0F0;border-top:6px solid var(--blue);box-shadow:0 4px 0 #C6D8F8;border-radius:16px}
.fc{border-color:var(--blue);border-top-width:6px;box-shadow:0 5px 0 #A9C2F3}
details{border:2px solid #8FB0F0;border-left:6px solid var(--blue);box-shadow:0 3px 0 #C6D8F8;border-radius:16px}
.opt{border:2px solid #B7C9EA}
.chip{border:2px solid #8FB0F0;font-weight:600}
.chip.on{border-color:var(--ink)}
.btn{box-shadow:0 3px 0 rgba(16,36,62,.25)}
.btn.alt{border:2px solid #8FB0F0}.btn.ok{border:2px solid var(--ok)}.btn.no{border:2px solid var(--bad)}
.rule{border:2px solid #8FB0F0}
input[type=text],textarea{border:2px solid #8FB0F0}
.card .card{box-shadow:none}
[data-t=vocab]{--c:#1F5FD6;--cb:#E4EDFF;--cl:#8FB0F0}
[data-t=quiz]{--c:#1E9E5A;--cb:#E3F6EB;--cl:#8ED1AB}
[data-t=gram]{--c:#7B3FD1;--cb:#F0E8FF;--cl:#BE9CF0}
[data-t=talk]{--c:#E0701A;--cb:#FFEFE0;--cl:#F2B98A}
[data-t=scan]{--c:#0E8A9A;--cb:#DFF4F7;--cl:#7CCAD4}
[data-t=game]{--c:#D6336C;--cb:#FFE6EF;--cl:#F0A1C0}
nav{gap:5px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:2px solid var(--line)}
nav button{border:2px solid var(--c);background:var(--cb);color:var(--c);border-radius:12px;padding:9px 1px;font-size:11px;font-weight:700;box-shadow:0 3px 0 var(--c);min-width:0}
nav button.on{background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(16,36,62,.45);transform:translateY(-2px)}
main h2{background:var(--c);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 rgba(16,36,62,.25)}
main .card,main details{border-color:var(--cl);border-top-color:var(--c);box-shadow:0 4px 0 var(--cb)}
main details{border-left-color:var(--c);border-top-color:var(--cl)}
main .btn{background:var(--c)}
main .btn.alt{background:var(--cb);color:var(--c);border-color:var(--cl)}
main .btn.ok{background:var(--okbg);color:var(--ok)}main .btn.no{background:var(--badbg);color:var(--bad)}
main .chip{border-color:var(--cl);background:var(--cb);color:var(--c)}
main .chip.on{background:var(--c);border-color:var(--c);color:#fff}
main .bar i{background:var(--c)}
main .rule,main .spk{background:var(--cb);color:var(--c);border:2px solid var(--cl)}
main .sc,main .fc .vi,main .big .n{color:var(--c)}
main .opt{border-color:var(--cl)}
main .opt.ok{border-color:var(--ok);background:var(--okbg)}main .opt.bad{border-color:var(--bad);background:var(--badbg)}
.ft{background:#fff;color:#1F5FD6;text-align:center;font-size:13px;font-weight:800;padding:6px 10px;border-top:2px solid var(--line);user-select:text}
.ft a{color:#D6336C;font-weight:800;text-decoration:underline}
</style>
</head>

 {t:"Tính từ và trạng từ (Adjective vs Adverb)",rule:"Tính từ bổ nghĩa danh từ, đứng trước danh từ hoặc sau be. Trạng từ bổ nghĩa động từ/tính từ, thường thêm -ly: careful → carefully. Bất quy tắc: good → well, fast → fast, hard → hard.",m:"Hỏi “làm như thế nào?” → trạng từ. Hỏi “như thế nào (là gì)?” → tính từ. Nhớ “He is a good driver = He drives well”.",

 {t:"Both / either / neither & đồng tình (so, neither)",rule:"both A and B: cả hai. either A or B: một trong hai. neither A nor B: không cái nào. Đồng tình: So + trợ động từ + S (khẳng định), Neither + trợ động từ + S (phủ định).",m:"Neither đã mang nghĩa phủ định nên không thêm “not”. “Me too” = So do I; “Me neither” = Neither do I.",

 {t:"Cụm động từ thường gặp (Phrasal verbs)",rule:"check in/out (nhận/trả phòng), look for (tìm), pick up (đón), carry out (thực hiện), figure out (tìm ra), turn down (từ chối), set up (thiết lập), fill in (điền).",m:"Học cả cụm kèm một câu ví dụ, đừng dịch từng từ. Nhóm theo động từ gốc: look up, look for, look after.",

 {t:"Động từ bất quy tắc thường gặp",rule:"be–was/were–been; go–went–gone; do–did–done; have–had–had; see–saw–seen; take–took–taken; buy–bought–bought; send–sent–sent; find–found–found; break–broke–broken; write–wrote–written; give–gave–given.",m:"Học theo nhóm vần: buy-bought-bought, bring-brought-brought. Nhóm giống nhau 3 cột: send, find, have, make.",

 {t:"Câu mệnh lệnh, đề nghị & lịch sự",rule:"V nguyên mẫu (Open it). Don’t + V. Let’s + V. Why don’t we + V? Would you mind + V-ing? Could/Would you + V?",m:"Càng lịch sự thì câu càng dài: Open it → Could you open it? → Would you mind opening it?",

 {t:"Hiện tại hoàn thành tiếp diễn",rule:"S + have/has + been + V-ing — hành động bắt đầu từ quá khứ và vẫn đang tiếp tục, nhấn mạnh quá trình.",m:"Có for/since + hành động còn kéo dài, hỏi “How long...?” → been + V-ing.",

 {t:"Tính từ -ed và -ing",rule:"-ing mô tả đặc điểm của sự vật (interesting). -ed mô tả cảm xúc của người (interested).",m:"Người cảm thấy → -ed. Vật gây ra → -ing. I am bored; the film is boring.",
  eg:[["The report is surprising.","Bản báo cáo gây ngạc nhiên."],["I am surprised by the result.","Tôi ngạc nhiên bởi kết quả."]]},
 {t:"Đại từ bất định & some / any / no / every",rule:"some- (khẳng định), any- (phủ định, nghi vấn), no- (nghĩa phủ định), every-. Kết hợp: -one, -body, -thing, -where. Đi với động từ số ít.",m:"Câu đã phủ định thì dùng any, không dùng no (không nói “don’t have no”).",
  eg:[["Everyone is here.","Mọi người đều có mặt."],["I didn’t find anything wrong.","Tôi không thấy gì sai."]]},
 {t:"Sở hữu cách ’s và of",rule:"Người: danh từ + ’s (Hao’s car). Danh từ số nhiều có s: s’ (the workers’ room). Vật: the + danh từ + of + danh từ.",m:"Người dùng ’s, vật dùng of. “the color of the box”, “Hao’s box”.",
  eg:[["This is my manager’s office.","Đây là văn phòng quản lý của tôi."],["The price of the goods is high.","Giá của hàng này cao."]]},
 {t:"Danh từ số nhiều bất quy tắc & danh từ ghép",rule:"man–men, woman–women, child–children, person–people, foot–feet, tooth–teeth. Không đổi: sheep, fish. Danh từ ghép: danh từ + danh từ (a shipping cost). Chỉ danh từ chính có số nhiều.",m:"Nhớ nhóm “men-women-children-people”. Danh từ ghép chỉ cho “s” vào từ cuối: two shipping costs.",
  eg:[["Three workers and two women inspected it.","Ba công nhân và hai phụ nữ kiểm tra."],["We need two bank accounts.","Chúng tôi cần hai tài khoản ngân hàng."]]},
 {t:"Mệnh đề trạng ngữ (when, while, until, unless...)",rule:"when/while/as soon as/before/after/until + mệnh đề. Chỉ thời gian tương lai: dùng hiện tại đơn sau when/until. unless = if not.",m:"Tương lai không đi sau when/if/until: “I will call you when I arrive” (không dùng will arrive).",
  eg:[["Call me when the goods arrive.","Gọi tôi khi hàng đến."],["We can’t ship unless you pay.","Chúng tôi không giao trừ khi bạn thanh toán."]]},
 {t:"So sánh kép & so sánh bội",rule:"the + so sánh hơn, the + so sánh hơn: càng... càng. twice/three times as + adj + as: gấp 2/3 lần. more and more + adj: ngày càng.",m:"“The more, the better.” Hai vế đều bắt đầu bằng the + so sánh hơn.",
  eg:[["The more you practice, the better you speak.","Càng luyện, bạn nói càng tốt."],["This box is twice as heavy as that one.","Thùng này nặng gấp đôi thùng kia."]]},
 {t:"Make / let / have / get + người + V",rule:"make/let/have + O + V nguyên mẫu (không to). get + O + to V. Bị động make: be made to V.",m:"Make, let, have bỏ to. Get giữ to: I got him to check it.",
  eg:[["The manager made us check every item.","Quản lý bắt chúng tôi kiểm từng món."],["I got him to sign the form.","Tôi nhờ anh ấy ký vào mẫu."]]},
 {t:"Giới từ đi với tính từ & động từ",rule:"interested in, good at, afraid of, responsible for, depend on, apply for, agree with, wait for, pay for, look forward to + V-ing.",m:"Học cả cụm: responsible FOR, depend ON. Sau giới từ luôn là danh từ hoặc V-ing.",
  eg:[["We depend on our suppliers.","Chúng tôi phụ thuộc nhà cung cấp."],["I look forward to meeting you.","Tôi mong được gặp bạn."]]},
 {t:"There is / There are và It",rule:"There is + danh từ số ít/không đếm được. There are + danh từ số nhiều. There was/were: quá khứ. It dùng cho thời tiết, thời gian, khoảng cách: It is raining. It is 5 o’clock.",m:"There + be chia theo danh từ đứng ngay sau nó. “There is a box and two bags” → chia theo danh từ đầu (a box).",
  eg:[["There are three defects in this batch.","Lô này có ba lỗi."],["It takes two days to clear customs.","Mất hai ngày để thông quan."]]},
 {t:"Câu hỏi gián tiếp (Indirect questions)",rule:"Mở đầu lịch sự (Could you tell me..., Do you know...) + từ hỏi + chủ ngữ + động từ (không đảo, không do/does). Yes/No dùng if/whether.",m:"Câu hỏi nằm trong câu khác thì trở về trật tự câu thường. Where is it? → Do you know where it is?",
  eg:[["Could you tell me where the warehouse is?","Bạn cho tôi biết kho ở đâu được không?"],["Do you know if the goods have arrived?","Bạn có biết hàng đã đến chưa?"]]},
 {t:"Prefer, would rather, had better",rule:"prefer A to B / prefer V-ing to V-ing. would rather + V (than + V). had better + V: nên làm (nếu không sẽ có hậu quả).",m:"Cả would rather và had better đều theo sau bằng V nguyên mẫu, không có to.",
  eg:[["I would rather pay by card.","Tôi thích trả bằng thẻ hơn."],["You had better check the label.","Bạn nên kiểm tra nhãn đi."]]},
 {t:"Be used to / Get used to và Used to",rule:"used to + V: thói quen đã bỏ. be/get used to + V-ing/danh từ: quen với (đang hoặc đang dần quen).",m:"Có chữ BE/GET đứng trước used to thì theo sau là V-ing: I’m used to working late.",
  eg:[["I’m used to working with foreign partners.","Tôi quen làm việc với đối tác nước ngoài."],["She is getting used to the new system.","Cô ấy đang dần quen hệ thống mới."]]},
 {t:"Although, despite, in spite of",rule:"Although/Though/Even though + mệnh đề (S + V). Despite/In spite of + danh từ hoặc V-ing. However/Nevertheless: đứng đầu câu, có dấu phẩy.",m:"Despite và in spite of không đi với mệnh đề, muốn dùng thì thêm the fact that: Despite the fact that it rained...",
  eg:[["Although the price is high, we will order.","Dù giá cao, chúng tôi vẫn đặt hàng."],["Despite the delay, the quality is good.","Dù chậm trễ, chất lượng vẫn tốt."]]},
 {t:"Trạng từ chỉ tần suất & vị trí trạng từ",rule:"always > usually > often > sometimes > rarely > never. Đứng trước động từ thường, sau be và trợ động từ. Trạng từ cách thức đứng sau động từ hoặc tân ngữ.",m:"Công thức: be + trạng từ; trạng từ + động từ thường. She is always late. She always arrives late.",
  eg:[["We usually inspect the goods on arrival.","Chúng tôi thường kiểm hàng khi hàng đến."],["He is never late.","Anh ấy không bao giờ trễ."]]},
 {t:"Mục đích: to, in order to, so that",rule:"to / in order to / so as to + V: để (cùng chủ ngữ). so that + mệnh đề (can/could/will/would): để (khác chủ ngữ hoặc nhấn mạnh).",m:"Cùng người làm → to V. Khác người hoặc muốn thêm can/will → so that + S + V.",
  eg:[["I called to confirm the order.","Tôi gọi để xác nhận đơn hàng."],["Send it today so that we can ship tomorrow.","Gửi hôm nay để mai chúng tôi giao."]]},
 {t:"Cách đọc số, ngày tháng, tiền và đơn vị",rule:"2,500 = two thousand five hundred. 1/2 = a half; 3/4 = three quarters. Ngày: May 5th đọc May the fifth. Năm: 2026 = twenty twenty-six. Tiền: $19.99 = nineteen ninety-nine hoặc nineteen dollars ninety-nine. 5 kg = five kilograms.",m:"Bỏ chữ “and” khi đọc số lớn trong Mỹ: 250 = two hundred fifty. Số thứ tự thêm -th (fourth, tenth), trừ first, second, third.",
  eg:[["The shipment weighs 1,200 kilograms.","Lô hàng nặng 1.200 kg."],["The deadline is October 15th.","Hạn chót là ngày 15 tháng 10."]]},
 {t:"Cấu trúc thông dụng với It và V-ing",rule:"It takes + (người) + thời gian + to V. It’s worth + V-ing. It’s no use / There’s no point in + V-ing. It’s the first time + have/has + V3. Spend + thời gian/tiền + V-ing.",m:"Nhớ các cụm cố định: worth V-ing, no use V-ing, spend … V-ing, busy V-ing, can’t help V-ing.",
  eg:[["It’s worth checking every carton.","Đáng để kiểm từng thùng."],["I spent two hours reviewing the contract.","Tôi mất hai giờ xem hợp đồng."]]},
 {t:"Câu trả lời ngắn & câu hỏi phủ định",rule:"Yes, I do. / No, it isn’t. Câu hỏi phủ định: Isn’t it ready? → trả lời theo sự thật (Yes, it is / No, it isn’t). Phản hồi: Really? Me too. I see. Sure. Of course.",m:"Trả lời theo sự thật chứ không theo từ hỏi: Isn’t it ready? Chưa sẵn sàng → No, it isn’t.",
  eg:[["Have you sent the file? Yes, I have.","Bạn gửi tệp chưa? Rồi."],["Isn’t he coming? No, he isn’t.","Anh ấy không đến à? Không."]]},
 {t:"Viết email: trang trọng và thân mật",rule:"Trang trọng: Dear Mr./Ms. …, I am writing to…, Please find attached…, Yours sincerely. Thân mật: Hi …, Just a quick note…, Thanks, Best. Không dùng viết tắt (I’m, can’t) trong văn bản rất trang trọng.",m:"Mở bằng mục đích, kết bằng hành động tiếp theo: I am writing to… / I look forward to your reply.",
  eg:[["I am writing to confirm our order.","Tôi viết để xác nhận đơn hàng của chúng ta."],["Please let me know if you need anything else.","Cần gì thêm xin báo cho tôi."]]},
 {t:"Nâng cao: Cấu trúc song song (Parallelism)",rule:"Các thành phần nối bằng and, or, but, not only... but also, either... or phải cùng dạng ngữ pháp (cùng V-ing, cùng to V, cùng danh từ, cùng mệnh đề).",m:"Nhìn vào chữ AND: hai bên phải là cặp cùng loại. Sai: reading and to write. Đúng: reading and writing.",
  eg:[["She enjoys reading, writing and traveling.","Cô ấy thích đọc, viết và du lịch."],["The product is not only cheap but also durable.","Sản phẩm không chỉ rẻ mà còn bền."]]},
 {t:"Nâng cao: Mệnh đề nhượng bộ rút gọn",rule:"Cùng chủ ngữ thì rút gọn: Although (he was) tired, ... → Although tired, ... Còn: Whatever, However + adj + S + V, No matter how/what, Much as, Even if.",m:"Bỏ chủ ngữ và to be: Although tired, he kept working. However hard he tried, he failed.",
  eg:[["Although tired, she finished the report.","Dù mệt, cô ấy vẫn hoàn thành báo cáo."],["However careful you are, mistakes happen.","Dù cẩn thận đến đâu, sai sót vẫn xảy ra."]]},
 {t:"Nâng cao: Danh hóa (Nominalisation)",rule:"Biến động từ/tính từ thành danh từ để câu trang trọng: decide → decision, develop → development, important → importance, increase → an increase.",m:"Câu trang trọng thường nhiều danh từ hơn động từ: “People use more cars” → “The increased use of cars...”.",
  eg:[["The development of trade has changed society.","Sự phát triển thương mại đã thay đổi xã hội."],["There has been a rapid increase in prices.","Giá cả tăng nhanh."]]},
 {t:"Nâng cao: Modal perfect (should have, must have...)",rule:"should have + V3: lẽ ra nên (nhưng đã không). must have + V3: chắc hẳn đã. might/could have + V3: có thể đã. can’t have + V3: chắc chắn không phải đã. needn’t have + V3: không cần phải (mà đã làm).",m:"Modal + have + V3 = nói về quá khứ. Should have = tiếc nuối, must have = suy đoán chắc chắn.",
  eg:[["You should have checked the label.","Lẽ ra bạn nên kiểm tra nhãn."],["He must have forgotten the meeting.","Chắc anh ấy đã quên cuộc họp."]]},
 {t:"Nâng cao: Bị động đặc biệt (It is said that...)",rule:"It is said/believed/reported that + mệnh đề. S + is said + to V / to have + V3. Bị động có tác nhân: be + V3 + by. Get-passive: He got fired.",m:"Hai cách: It is said that he is rich = He is said to be rich. Hành động xảy ra trước dùng to have + V3.",
  eg:[["The goods are said to have been damaged.","Hàng được cho là đã bị hư."],["It is reported that sales have dropped.","Có báo cáo rằng doanh số đã giảm."]]},
 {t:"Nâng cao: Mệnh đề quan hệ phức tạp",rule:"whom (tân ngữ chỉ người), giới từ + which/whom (the company for which I work), which bổ nghĩa cả mệnh đề (He passed, which surprised us), whose, mệnh đề quan hệ có dấu phẩy chỉ thông tin thêm.",m:"Giới từ đứng trước thì chỉ dùng which/whom (không dùng that). Có dấu phẩy thì không dùng that.",
  eg:[["The supplier with whom we signed is reliable.","Nhà cung cấp mà chúng tôi ký là đáng tin."],["He arrived late, which annoyed everyone.","Anh ấy đến trễ, điều này làm mọi người khó chịu."]]},
 {t:"Nâng cao: Liên từ điều kiện mở rộng",rule:"provided/providing that, as long as, on condition that: miễn là. unless: trừ khi. otherwise: nếu không thì. but for + N: nếu không có. supposing: giả sử. in case: phòng khi.",m:"Unless = if not, không dùng phủ định thêm lần nữa. In case = phòng khi (chưa xảy ra), if = nếu xảy ra.",
  eg:[["We will ship provided that you pay today.","Chúng tôi sẽ giao với điều kiện bạn trả hôm nay."],["Take an umbrella in case it rains.","Mang ô phòng khi trời mưa."]]},
 {t:"Nâng cao: Động từ tri giác & nhận biết",rule:"see/hear/watch/notice + O + V: thấy toàn bộ hành động. + O + V-ing: thấy đang diễn ra. Have/let/make + O + V. Hope/expect + to V; suggest + V-ing.",m:"V = thấy từ đầu đến cuối, V-ing = thấy một phần đang diễn ra. I saw him cross the road / crossing the road.",
  eg:[["I heard her singing in the kitchen.","Tôi nghe cô ấy đang hát trong bếp."],["We watched them unload the container.","Chúng tôi xem họ dỡ container."]]},
 {t:"Nâng cao: Mệnh đề danh từ (Noun clauses)",rule:"that, what, whether/if, who, where, how + mệnh đề, đóng vai trò chủ ngữ, tân ngữ hoặc bổ ngữ. What he said was true. I wonder whether it is ready.",m:"Mệnh đề danh từ dùng trật tự câu thường (không đảo). Chủ ngữ là mệnh đề thì chia động từ số ít.",
  eg:[["What matters is the quality.","Điều quan trọng là chất lượng."],["I don’t know whether the order has arrived.","Tôi không biết đơn hàng đã đến chưa."]]},
 {t:"Nâng cao: Cấu trúc nhấn mạnh",rule:"so + adj + that, such + (a) adj + N + that, not only... but also (đảo ngữ), What + S + V + is..., It is... that. Phó từ nhấn mạnh: indeed, in fact, certainly.",m:"So đi với tính từ, such đi với danh từ. Not only đứng đầu thì đảo trợ động từ: Not only did he apologize...",
  eg:[["The box was so heavy that nobody could lift it.","Thùng nặng đến nỗi không ai nhấc nổi."],["It was such a good deal that we signed at once.","Đó là thỏa thuận tốt đến mức chúng tôi ký ngay."]]},
 {t:"Nâng cao: Văn phong trang trọng & hedging",rule:"Thay từ thông tục bằng từ trang trọng: get → obtain, ask for → request, enough → sufficient, show → demonstrate. Dùng hedging: may, might, tend to, appear to, it is likely that.",m:"Trang trọng = khách quan + thận trọng. Thay “Everyone knows” bằng “It is widely believed that”.",
  eg:[["It is widely believed that quality comes first.","Nhiều người tin chất lượng là trên hết."],["This may lead to higher costs.","Điều này có thể dẫn đến chi phí cao hơn."]]}
];
var TIPS=[
 "Ngôi he/she/it thêm -s. Phủ định/nghi vấn: do/does + V, không thêm -s lần nữa.",
 "Dấu hiệu: now, at the moment, Look!, Listen! Công thức: am/is/are + V-ing.",
 "Dấu hiệu: yesterday, last…, ago. Câu hỏi/phủ định dùng did + V nguyên mẫu, không chia -ed hai lần.",
 "Will = quyết định ngay lúc nói. Going to = đã có kế hoạch hoặc có dấu hiệu rõ ràng.",
 "An đi với ÂM nguyên âm (an hour, a university). Nói về thứ đã biết, duy nhất → the.",
 "AT điểm giờ, ON ngày, IN dài hơn (tháng, năm). Nhớ “Giờ AT, Ngày ON, Tháng Năm IN”.",
 "Công thức “đang… thì”: when + quá khứ đơn cắt ngang quá khứ tiếp diễn.",
 "Từ khóa: for + khoảng thời gian, since + mốc thời gian, already, yet, ever, never.",
 "Có hai hành động quá khứ: cái nào xảy ra TRƯỚC dùng had + V3, cái sau dùng quá khứ đơn.",
 "Từ khóa: by + mốc thời gian tương lai (by Friday) → will have + V3.",
 "Sau modal KHÔNG thêm to, không thêm -s. Nhớ: must (nội tại), have to (do bên ngoài).",
 "Bị động = be + V3. Chỉ cần đổi be theo thì của câu. Hàng được kiểm tra → be inspected.",
 "Nhớ “0-1-2-3”: 0 thói quen, 1 có thể xảy ra, 2 giả sử hiện tại (were), 3 tiếc nuối quá khứ (had + V3).",
 "Tính từ ngắn: -er / -est. Tính từ dài (từ 3 âm tiết): more / most. So sánh hơn luôn đi với than.",
 "Who thay người, which thay vật, whose thay sở hữu. Có dấu phẩy thì không dùng that.",
 "Lùi một thì: am/is → was, will → would, can → could. Nhớ đổi cả đại từ.",
 "Nhóm V-ing: enjoy, avoid, finish, mind, keep. Nhóm to V: want, hope, decide, plan, need.",
 "Đếm được: many, few. Không đếm được: much, little. Câu khẳng định thường dùng a lot of.",
 "Câu hỏi đuôi: câu chính khẳng định → đuôi phủ định. Đuôi dùng cùng trợ động từ với câu chính.",
 "Used to + V: ngày xưa hay làm. Be used to + V-ing: quen với (khác nghĩa, dễ nhầm).",
 "Because + mệnh đề, because of + danh từ. Although và but không dùng cùng lúc trong một câu."
];
var GQ=[
 ["She ___ to school every day.",["go","goes","going","went"],1,"Ngôi she dùng goes ở hiện tại đơn."],
 ["They ___ football right now.",["play","plays","are playing","played"],2,"“Right now” → hiện tại tiếp diễn: are playing."],
 ["I ___ a movie yesterday.",["see","saw","seen","will see"],1,"“Yesterday” → quá khứ đơn: saw."],
 ["Look at the clouds! It ___ rain.",["will","is going to","did","does"],1,"Có dấu hiệu ở hiện tại → be going to."],
 ["I need ___ umbrella.",["a","an","the","(không cần)"],1,"Umbrella bắt đầu bằng nguyên âm → an."],
 ["The meeting is ___ Monday.",["in","at","on","by"],2,"Thứ trong tuần dùng on."],
 ["He ___ like spicy food.",["don’t","doesn’t","isn’t","not"],1,"Ngôi he phủ định: doesn’t + V."],
 ["___ you finish the report last night?",["Do","Are","Did","Have"],2,"“Last night” → quá khứ: Did."],
 ["I ___ here since 2020.",["live","lived","have lived","am living"],2,"Since + mốc thời gian → hiện tại hoàn thành."],
 ["The goods ___ yesterday.",["inspected","were inspected","inspect","are inspecting"],1,"Hàng bị tác động → bị động: were inspected."],
 ["If I ___ rich, I would travel.",["am","was","were","will be"],2,"Điều kiện loại 2 dùng were cho mọi ngôi."],
 ["You ___ see a doctor. You look sick.",["must to","should","can to","would"],1,"Lời khuyên → should + V."],
 ["This is the man ___ called you.",["which","who","whose","where"],1,"Thay cho người, làm chủ ngữ → who."],
 ["She is ___ than her sister.",["tall","taller","tallest","more tall"],1,"Tính từ ngắn so sánh hơn: tall-er."],
 ["He said he ___ tired.",["is","was","will be","has been"],1,"Câu gián tiếp lùi thì: is → was."],
 ["I enjoy ___ English.",["to study","studying","study","studied"],1,"Enjoy + V-ing."],

/* ---------- TRẠNG THÁI ---------- */
var S={xp:0,streak:0,last:"",known:{}};
try{var raw=localStorage.getItem("ec_state");if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem("ec_state",JSON.stringify(S));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function touchDay(){var t=today();if(S.last!==t){var y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=(S.last===y)?S.streak+1:1;S.last=t;save();}}
function addXP(n){S.xp+=n;touchDay();save();hud();}
function hud(){document.getElementById("xp").textContent=S.xp;document.getElementById("st").textContent=S.streak;}
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

/* ---------- PHÁT ÂM ---------- */
function speak(text,rate){
  try{
    if(!window.speechSynthesis){alert("Thiết bị chưa hỗ trợ phát âm. Hãy bật Text-to-Speech trong cài đặt Android.");return;}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||0.9;speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- TỪ VỰNG ---------- */
var vTopic=Object.keys(VOCAB)[0],vList=[],vi=0,flipped=false;
function vocab(){
  var topics=Object.keys(VOCAB);
  var h='<div class="chips">'+topics.map(function(t){return '<button class="chip'+(t===vTopic?' on':'')+'" data-topic="'+esc(t)+'">'+t+'</button>'}).join("")+'</div>';
  if(!vList.length){vList=VOCAB[vTopic];vi=0;flipped=false;}
  var w=vList[vi],known=Object.keys(VOCAB[vTopic]).filter(function(k){return S.known[VOCAB[vTopic][k][0]]}).length;
  h+='<div class="hint">Đã thuộc '+known+'/'+VOCAB[vTopic].length+' từ · Thẻ '+(vi+1)+'/'+vList.length+'</div>';
  h+='<div class="bar"><i style="width:'+(known/VOCAB[vTopic].length*100)+'%"></i></div>';
  h+='<div class="card fc" id="fc">';
  if(!flipped){h+='<div class="en">'+w[0]+'</div><div class="ipa">'+w[1]+'</div><div class="hint">Chạm để xem nghĩa</div>';}
  else{h+='<div class="vi">'+w[2]+'</div><div class="ex">“'+w[3]+'”</div>';}
  h+='</div>';
  h+='<div class="row" style="margin-bottom:12px"><button class="spk" id="s1" title="Nghe từ">Nghe</button><button class="btn alt" id="s2">Nghe câu ví dụ</button></div>';
  h+='<div class="row"><button class="btn no" id="vno">Chưa nhớ</button><button class="btn ok" id="vyes">Đã nhớ +5</button></div>';
  $("main").innerHTML='<h2>Học từ vựng</h2>'+h;
  document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){vTopic=b.dataset.topic;vList=[];vocab();}});
  $("fc").onclick=function(){flipped=!flipped;vocab();};
  $("s1").onclick=function(){speak(w[0],.8)};
  $("s2").onclick=function(){speak(w[3])};
  function nextCard(){vi=(vi+1)%vList.length;flipped=false;vocab();}
  $("vno").onclick=function(){delete S.known[w[0]];save();nextCard();};
  $("vyes").onclick=function(){if(!S.known[w[0]]){S.known[w[0]]=1;addXP(5);}nextCard();};
}

function buildQuiz(){
  var all=[];Object.keys(VOCAB).forEach(function(k){VOCAB[k].forEach(function(w){all.push(w)})});
  var qs=shuffle(all).slice(0,6).map(function(w){
    var wrong=shuffle(all.filter(function(x){return x[0]!==w[0]})).slice(0,3).map(function(x){return x[2]});
    var opts=shuffle([w[2]].concat(wrong));
    return {q:'Nghĩa của “'+w[0]+'” là gì?',o:opts,a:opts.indexOf(w[2]),e:w[0]+" "+w[1]+" = "+w[2]+'. Ví dụ: '+w[3],say:w[0]};
  });
  var gq=shuffle(GQ).slice(0,4).map(function(g){return {q:g[0],o:g[1],a:g[2],e:g[3]}});
  Q={list:shuffle(qs.concat(gq)),i:0,score:0,done:false,picked:-1};
}
function quiz(){
  if(!Q)buildQuiz();
  if(Q.done){
    var pct=Math.round(Q.score/Q.list.length*100);
    var msg=pct>=80?"Xuất sắc! Hãy thử chủ đề mới.":pct>=50?"Khá tốt! Ôn lại các câu sai để tiến bộ.":"Đừng nản. Học lại thẻ từ vựng rồi thử lần nữa.";
    $("main").innerHTML='<h2>Kết quả</h2><div class="card big"><div class="n">'+Q.score+'/'+Q.list.length+'</div><p>'+msg+'</p></div><button class="btn" id="again">Làm bài mới</button>';
    $("again").onclick=function(){Q=null;quiz();};return;
  }
  var c=Q.list[Q.i],answered=Q.picked>=0;
  var h='<div class="bar"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div><div class="hint">Câu '+(Q.i+1)+'/'+Q.list.length+'</div><div class="card"><div class="q">'+c.q+'</div>';
  c.o.forEach(function(o,k){
    var cl="opt";if(answered){if(k===c.a)cl+=" ok";else if(k===Q.picked)cl+=" bad";}
    h+='<button class="'+cl+'" data-k="'+k+'">'+o+'</button>';
  });
  if(answered){var good=Q.picked===c.a;h+='<div class="fb '+(good?'ok':'bad')+'"><b>'+(good?'Chính xác! +10 XP':'Chưa đúng.')+'</b><br>'+c.e+'</div>';}
  h+='</div>';
  if(answered)h+='<button class="btn" id="nx">'+(Q.i+1===Q.list.length?'Xem kết quả':'Câu tiếp theo')+'</button>';
  $("main").innerHTML='<h2>Luyện tập</h2>'+h;
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    if(Q.picked>=0)return;Q.picked=+b.dataset.k;
    if(Q.picked===c.a){Q.score++;addXP(10);}
    if(c.say)speak(c.say,.8);quiz();};});
  if(answered)$("nx").onclick=function(){Q.i++;Q.picked=-1;if(Q.i>=Q.list.length)Q.done=true;quiz();};
}

function gloss(line){var l=line.toLowerCase(),r=[],seen={};
  LBL.concat(allW().map(function(w){return [w[0],w[2]]})).forEach(function(p){

  return r.slice(0,6)}

  g.o.forEach(function(o,k){var c="opt";if(g.p>=0){if(o===g.w[2])c+=" ok";else if(k===g.p)c+=" bad"}h+='<button class="'+c+'" data-k="'+k+'">'+o+'</button>'});
  if(g.p>=0)h+='<div class="fb '+(g.o[g.p]===g.w[2]?'ok':'bad')+'"><b>'+g.w[0]+'</b> '+g.w[1]+' = '+g.w[2]+'</div><button class="btn" id="lx">Từ tiếp theo</button>';
  $("main").innerHTML=h+'</div>'+back();bindBack();
  $("ln").onclick=function(){speak(g.w[0],.8)};if(fresh)setTimeout(function(){speak(g.w[0],.8)},250);
  if(g.p>=0)$("lx").onclick=function(){gListen(true)};
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){if(g.p>=0)return;g.p=+b.dataset.k;if(g.o[g.p]===g.w[2]){g.sc++;addXP(6)}gListen()}});
}
function gCloze(next){
  if(next||!G.cl){var w,re;do{w=rnd(allW());re=new RegExp(w[0].replace(/[^a-zA-Z ]/g,""),"i")}while(!re.test(w[3]));
    var o=shuffle([w[0]].concat(shuffle(allW().filter(function(x){return x[0]!==w[0]})).slice(0,3).map(function(x){return x[0]})));
    G.cl={w:w,q:w[3].replace(re,"_____"),o:o,p:-1,sc:G.cl?G.cl.sc:0};}
  var g=G.cl,h='<h2>Điền từ vào câu</h2><div class="hint">Điểm: '+g.sc+'</div><div class="card"><div class="q">'+g.q+'</div><div class="hint" style="text-align:left">Gợi ý nghĩa: '+g.w[2]+'</div>';
  g.o.forEach(function(o,k){var c="opt";if(g.p>=0){if(o===g.w[0])c+=" ok";else if(k===g.p)c+=" bad"}h+='<button class="'+c+'" data-k="'+k+'">'+o+'</button>'});
  if(g.p>=0)h+='<div class="fb '+(g.o[g.p]===g.w[0]?'ok':'bad')+'">'+g.w[3]+'</div><button class="btn" id="cx">Câu tiếp theo</button>';
  $("main").innerHTML=h+'</div>'+back();bindBack();
  if(g.p>=0)$("cx").onclick=function(){gCloze(true)};
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){if(g.p>=0)return;g.p=+b.dataset.k;if(g.o[g.p]===g.w[0]){g.sc++;addXP(8);speak(g.w[3])}gCloze()}});
}
function gTime(){
  clearInterval(G.iv);
  var g=G.tm;
  if(!g){$("main").innerHTML='<h2>Đua 30 giây</h2><div class="card big"><p>Nghĩa tiếng Việt đưa ra là đúng hay sai? Mỗi câu đúng +1 điểm, sai thì trừ 1.</p><button class="btn" id="go">Bắt đầu</button></div>'+back();bindBack();
    $("go").onclick=function(){G.tm={t:30,sc:0,end:false};nextT();gTime()};return;}
  if(g.end||g.t<=0){g.end=true;addXP(Math.max(0,g.sc));$("main").innerHTML='<h2>Hết giờ</h2><div class="card big"><div class="n">'+g.sc+'</div><p>điểm. Điểm số được cộng vào XP.</p><button class="btn" id="go">Chơi lại</button></div>'+back();bindBack();
    $("go").onclick=function(){G.tm={t:30,sc:0,end:false};nextT();gTime()};return;}
  $("main").innerHTML='<h2>Đua 30 giây</h2><div class="hint">Thời gian: <b id="tt">'+g.t+'</b> giây · Điểm: <b id="ts">'+g.sc+'</b></div><div class="card big"><div class="en" style="font-size:32px;font-weight:800">'+g.c.w[0]+'</div><div class="vi" style="font-size:22px;color:var(--blue);margin:8px 0 16px;font-weight:700">= '+g.c.m+'</div><div class="row"><button class="btn ok" id="ty">Đúng</button><button class="btn no" id="tn">Sai</button></div></div>'+back();bindBack();
  G.iv=setInterval(function(){var a=document.querySelector("nav button.on");if(!a||a.dataset.t!=="game"||G.mode!=="t"||!$("tt")){clearInterval(G.iv);return}
    g.t--;if(g.t<=0){clearInterval(G.iv);gTime()}else $("tt").textContent=g.t},1000);
  function ans(v){if(v===g.c.ok)g.sc++;else g.sc--;nextT();gTime()}
  $("ty").onclick=function(){ans(true)};$("tn").onclick=function(){ans(false)};
}
function nextT(){var w=rnd(allW()),ok=Math.random()<.5,m=w[2];if(!ok){var o;do{o=rnd(allW())}while(o[0]===w[0]);m=o[2]}G.tm.c={w:w,m:m,ok:ok}}
var VIEWS={scan:scan,game:game,vocab:vocab,quiz:quiz,gram:gram,talk:talk};
function go(t){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
  $("main").setAttribute("data-t",t);VIEWS[t]();$("main").scrollTop=0;
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
hud();go("vocab");
</script>
</body>
